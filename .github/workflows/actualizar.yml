name: Actualizar Pokédex

on:
  schedule:
    - cron: "7 23 * * *"   # 00:07 en Madrid en invierno, 01:07 en verano
    - cron: "17 5 * * *"   # repaso de seguridad por la mañana
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar data.json
        run: python build.py
      - name: Guardar cambios
        run: |
          git config user.name "pokedex-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json historial.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualización $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
